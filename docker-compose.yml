services:
  # Standard Ubuntu tests with system bash
  test:
    build: .
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: bats tests/bats

  # Interactive shell for debugging
  shell:
    build: .
    volumes:
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: /bin/bash
