name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Ubuntu 22.04 with system bash (5.x)
  test-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build juvy.sh
        run: |
          if [[ -f scripts/build.sh ]]; then
            bash scripts/build.sh
          fi

      - name: Build Docker image
        run: docker compose build test

      - name: Run tests
        run: docker compose run --rm test

  # macOS tests - Bash 3.2 compatibility (macOS default bash version)
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show environment info
        run: |
          echo "Bash version: $BASH_VERSION"
          git --version
          rsync --version | head -1

      - name: Install bats
        run: |
          brew install bats-core
          # Install helper libraries (not available as Homebrew formulas)
          sudo mkdir -p /usr/local/lib/bats
          sudo git clone --depth 1 https://github.com/bats-core/bats-support.git /usr/local/lib/bats/bats-support
          sudo git clone --depth 1 https://github.com/bats-core/bats-assert.git /usr/local/lib/bats/bats-assert

      - name: Build juvy.sh
        run: |
          if [[ -f scripts/build.sh ]]; then
            bash scripts/build.sh
          fi

      - name: Run tests
        run: bats tests/bats
