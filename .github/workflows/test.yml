name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Docker-based tests - Ubuntu with system bash
  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build juvy.sh
        run: |
          if [[ -f scripts/build.sh ]]; then
            bash scripts/build.sh
          fi

      - name: Build Docker image
        run: docker compose build test

      - name: Run tests
        run: docker compose run --rm test

  # macOS tests - Bash 3.2 compatibility (macOS default bash version)
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show environment info
        run: |
          echo "Bash version: $BASH_VERSION"
          git --version
          rsync --version | head -1

      - name: Install bats
        run: |
          brew install bats-core
          brew install bats-support bats-assert

      - name: Build juvy.sh
        run: |
          if [[ -f scripts/build.sh ]]; then
            bash scripts/build.sh
          fi

      - name: Run tests
        env:
          BATS_SUPPORT_DIR: /opt/homebrew/lib/bats-support
          BATS_ASSERT_DIR: /opt/homebrew/lib/bats-assert
        run: bats tests/bats
