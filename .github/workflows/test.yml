name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Docker-based tests - Ubuntu with system bash
  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build juvy.sh
        run: |
          if [[ -f scripts/build.sh ]]; then
            bash scripts/build.sh
          fi

      - name: Build Docker image
        run: docker compose build test

      - name: Run tests
        run: docker compose run --rm test

  # Docker-based tests - Bash 3.2 compatibility (macOS default)
  test-bash32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build juvy.sh
        run: |
          if [[ -f scripts/build.sh ]]; then
            bash scripts/build.sh
          fi

      - name: Build Bash 3.2 Docker image
        run: docker compose build test-bash32

      - name: Run Bash 3.2 compatibility tests
        run: docker compose run --rm test-bash32

  # Native runner tests as fallback (no Docker required)
  test-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show environment info
        run: |
          echo "Bash version: $BASH_VERSION"
          git --version
          rsync --version | head -1

      - name: Install bats
        run: |
          sudo npm install -g bats
          # Install helper libraries
          sudo mkdir -p /usr/local/lib/bats
          sudo git clone --depth 1 https://github.com/bats-core/bats-support.git /usr/local/lib/bats/bats-support
          sudo git clone --depth 1 https://github.com/bats-core/bats-assert.git /usr/local/lib/bats/bats-assert

      - name: Build juvy.sh
        run: |
          if [[ -f scripts/build.sh ]]; then
            bash scripts/build.sh
          fi

      - name: Run tests
        run: bats tests/bats

  # macOS tests (commented out - enable when needed)
