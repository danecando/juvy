name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show environment info
        run: |
          echo "Bash version: $BASH_VERSION"
          git --version
          rsync --version | head -1

      - name: Run integration tests
        run: bash tests/run-tests.sh
